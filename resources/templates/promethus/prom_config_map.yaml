apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    prometheusK8s:
      retention: 15d
      volumeClaimTemplate:
        metadata:
          name: prometheusdb
        spec:
          storageClassName: lvms-promethues-vg
          volumeMode: Filesystem
          resources:
            requests:
              storage: 4096Gi
    alertmanagerMain:
      volumeClaimTemplate:
        metadata:
          name: alertmanager
        spec:
          storageClassName: lvms-promethues-vg
          volumeMode: Filesystem
          resources:
            requests:
              storage: 1024Gi
