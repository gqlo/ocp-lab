# Block I/O experiment pod — privileged, mounts /sys/kernel/debug and a PVC block device.
# Image: ocp-trace:<OCP-version> (DTK + eBPF/network tools). Build: learning/ebpf/build.sh
# Apply: sed "s/OCP_VERSION/$(oc get clusterversion version -o jsonpath='{.status.desired.version}')/" ddpod.yaml | oc apply -f -
apiVersion: v1
kind: Pod
metadata:
  name: dd-experiment
spec:
  containers:
  - name: block-writer
    image: quay.io/rh_ee_lguoqing/ocp-trace:OCP_VERSION
    command: ["/bin/sleep", "infinity"]
    securityContext:
      privileged: true
    resources:
      limits:
        cpu: 750m
        memory: 600M
      requests:
        cpu: 100m
        memory: 60M
    volumeDevices:
    - name: blank-1tb-disk
      devicePath: /dev/xvdg
    volumeMounts:
    - name: kernel-debug
      mountPath: /sys/kernel/debug
  volumes:
  - name: blank-1tb-disk
    persistentVolumeClaim:
      claimName: blank-1tb-disk
  - name: kernel-debug
    hostPath:
      path: /sys/kernel/debug
      type: Directory
