# Step 4: NetworkAttachmentDefinition for br-ex localnet
# Source: https://blog.epheo.eu/articles/openshift-localnet/index.html
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br-ex-network
  namespace: default
spec:
  config: '{
            "name":"br-ex-network",
            "type":"ovn-k8s-cni-overlay",
            "cniVersion":"0.4.0",
            "topology":"localnet",
            "subnets": "198.18.0.0/16",
            "excludeSubnets": "198.18.0.0/27",
            "netAttachDefName":"default/br-ex-network"
          }'
