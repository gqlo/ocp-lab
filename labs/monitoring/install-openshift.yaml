      spec:
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue:
        - $__all
        display:
          name: Node
        name: node
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: thanos-querier
            labelName: node
            matchers:
            - kube_node_info{}
    - kind: ListVariable
      spec:
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue:
        - $__all
        display:
          name: Namespace
        name: namespace
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: thanos-querier
            labelName: namespace
            matchers:
            - kube_namespace_labels{}
    - kind: ListVariable
      spec:
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue:
        - $__all
        display:
          name: VMI
        name: vmi
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: thanos-querier
            labelName: name
            matchers:
            - kubevirt_vmi_info{node=~"$node", namespace=~"$namespace"}
    - kind: ListVariable
      spec:
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue:
        - $__all
        display:
          name: Volume
        name: persistentvolumeclaim
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: thanos-querier
            labelName: persistentvolumeclaim
            matchers:
            - kube_persistentvolumeclaim_info{namespace=~"$namespace"}
    - kind: ListVariable
      spec:
        allowAllValue: true
        allowMultiple: true
        customAllValue: .*
        defaultValue:
        - $__all
        display:
          name: Operation
        name: operation
        plugin:
          kind: StaticListVariable
          spec:
            values:
            - read
            - write
            - flush
            - discard
            - open
            - getattr
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: false
        defaultValue: 5m
        display:
          name: Rate Interval
        name: interval
        plugin:
          kind: StaticListVariable
          spec:
            values:
            - 1m
            - 2m
            - 5m
            - 10m
    - kind: ListVariable
      spec:
        allowAllValue: false
        allowMultiple: false
        defaultValue: "25"
        display:
          name: Limit
        name: topk
        plugin:
          kind: StaticListVariable
          spec:
            values:
            - "10"
            - "25"
            - "50"
            - "100"
---
apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  labels:
    app: kubevirt-metrics-exporter
  name: thanos-querier
  namespace: kubevirt-metrics-exporter
spec:
  client:
    tls:
      caCert:
        certPath: /ca/service-ca.crt
        type: file
      enable: true
  config:
    default: true
    display:
      name: Thanos Querier
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            secret: thanos-querier-secret
            url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
---
allowHostDirVolumePlugin: true
allowHostIPC: false
allowHostNetwork: false
allowHostPID: true
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities:
- SYS_PTRACE
- DAC_OVERRIDE
- BPF
- PERFMON
- SYS_RESOURCE
apiVersion: security.openshift.io/v1
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
kind: SecurityContextConstraints
metadata:
  name: kubevirt-metrics-exporter
readOnlyRootFilesystem: true
requiredDropCapabilities:
- ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
volumes:
- configMap
- downwardAPI
- emptyDir
- hostPath
- projected
- secret
